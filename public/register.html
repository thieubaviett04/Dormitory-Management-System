<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký Ký túc xá</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }

        .container {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 400px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #218838;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Đăng Ký Chỗ Ở</h2>
        <form id="registerForm">
            <div class="form-group">
                <label>Mã sinh viên:</label>
                <input type="text" id="student_code" required>
            </div>
            <div class="form-group">
                <label>Họ và tên:</label>
                <input type="text" id="full_name" required>
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Số điện thoại:</label>
                <input type="text" id="phone_number">
            </div>
            <div class="form-group">
                <label>Giới tính:</label>
                <select id="gender">
                    <option value="male">Nam</option>
                    <option value="female">Nữ</option>
                    <option value="other">Khác</option>
                </select>
            </div>
            <div class="form-group">
                <label>Ngày sinh:</label>
                <input type="date" id="date_of_birth" required>
            </div>
            <div class="form-group">
                <label>ID Phòng muốn đăng ký:</label>
                <input type="number" id="room_id" required>
            </div>
            <button type="submit">Gửi Đăng Ký</button>
        </form>
        <div id="message"></div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const data = {
                student_code: document.getElementById('student_code').value,
                full_name: document.getElementById('full_name').value,
                email: document.getElementById('email').value,
                phone_number: document.getElementById('phone_number').value, // Đã bổ sung gửi số điện thoại
                gender: document.getElementById('gender').value,
                date_of_birth: document.getElementById('date_of_birth').value,
                room_id: document.getElementById('room_id').value
            };

            fetch('/registration/store', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify(data)
            })
                .then(response => response.json())
                .then(result => {
                    const messageDiv = document.getElementById('message');
                    if (result.message && !result.exception) { // Thêm điều kiện để chắc chắn không phải lỗi từ server
                        messageDiv.textContent = result.message;
                        messageDiv.className = 'success';
                        document.getElementById('registerForm').reset();
                    } else {
                        messageDiv.textContent = result.message || 'Có lỗi xảy ra, vui lòng kiểm tra lại!';
                        messageDiv.className = 'error';
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('message').textContent = 'Lỗi kết nối đến máy chủ!';
                    document.getElementById('message').className = 'error';
                });
        });
    </script>

</body>

</html>
