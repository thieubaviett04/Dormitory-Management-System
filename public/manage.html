<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Đơn Đăng Ký</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            padding: 20px;
        }

        .container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 900px;
            margin: 0 auto;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        .btn {
            padding: 6px 12px;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 5px;
        }

        .btn-approve {
            background-color: #28a745;
        }

        .btn-reject {
            background-color: #dc3545;
        }

        .btn-waitlist {
            background-color: #fd7e14;
        }

        .btn-approve:hover {
            background-color: #218838;
        }

        .btn-reject:hover {
            background-color: #c82333;
        }

        .btn-waitlist:hover {
            background-color: #e96b02;
        }

        .status-pending {
            color: #ffc107;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Danh Sách Đơn Chờ Duyệt</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Mã SV</th>
                    <th>Họ Tên</th>
                    <th>ID Phòng</th>
                    <th>Trạng Thái</th>
                    <th>Hành Động</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Dữ liệu từ Backend sẽ được Javascript đổ tự động vào đây -->
            </tbody>
        </table>
    </div>

    <script>
        function escapeHtml(value) {
            const element = document.createElement('div');
            element.textContent = value ?? '';
            return element.innerHTML;
        }

        async function fetchPending() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Đang tải...</td></tr>';

            try {
                const response = await fetch('/registration/pending', {
                    headers: { 'Accept': 'application/json' }
                });
                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.message || 'Không thể tải danh sách đơn chờ duyệt.');
                }

                tbody.innerHTML = '';
                if (!result.data || result.data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Không có đơn đăng ký nào đang chờ.</td></tr>';
                    return;
                }

                result.data.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${item.id}</td>
                        <td>${escapeHtml(item.student.student_code)}</td>
                        <td>${escapeHtml(item.student.full_name)}</td>
                        <td>${item.room_id}</td>
                        <td class="status-pending">${item.status}</td>
                        <td>
                            <button class="btn btn-approve" onclick="updateStatus(${item.id}, 'approved')">Duyệt</button>
                            <button class="btn btn-waitlist" onclick="updateStatus(${item.id}, 'waitlist')">Danh sách chờ</button>
                            <button class="btn btn-reject" onclick="updateStatus(${item.id}, 'rejected')">Từ chối</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error('Lỗi tải dữ liệu:', error);
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:red;">${escapeHtml(error.message)}</td></tr>`;
            }
        }

        async function updateStatus(id, newStatus) {
            const actionNames = {
                approved: 'DUYỆT',
                rejected: 'TỪ CHỐI',
                waitlist: 'ĐƯA VÀO DANH SÁCH CHỜ'
            };
            const rejectedReason = newStatus === 'rejected'
                ? prompt('Nhập lý do từ chối:')
                : null;

            if (newStatus === 'rejected' && !rejectedReason?.trim()) {
                alert('Lý do từ chối là bắt buộc.');
                return;
            }

            const actionName = actionNames[newStatus];
            if (!confirm(`Bạn có chắc chắn muốn ${actionName} đơn số ${id} này?`)) return;

            try {
                const response = await fetch(`/registration/update/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        status: newStatus,
                        rejected_reason: rejectedReason
                    })
                });
                const result = await response.json();

                if (!response.ok) {
                    const validationMessages = Object.values(result.errors || {}).flat();
                    throw new Error(validationMessages[0] || result.message || 'Không thể cập nhật trạng thái.');
                }

                alert(result.message);
                fetchPending();
            } catch (error) {
                console.error('Lỗi cập nhật:', error);
                alert(error.message || 'Có lỗi xảy ra khi cập nhật!');
            }
        }

        fetchPending();
    </script>

</body>

</html>
