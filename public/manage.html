<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Đơn Đăng Ký</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            padding: 20px;
        }

        .container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 900px;
            margin: 0 auto;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        .btn {
            padding: 6px 12px;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 5px;
        }

        .btn-approve {
            background-color: #28a745;
        }

        .btn-reject {
            background-color: #dc3545;
        }

        .btn-approve:hover {
            background-color: #218838;
        }

        .btn-reject:hover {
            background-color: #c82333;
        }

        .status-pending {
            color: #ffc107;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Danh Sách Đơn Chờ Duyệt</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Mã SV</th>
                    <th>Họ Tên</th>
                    <th>ID Phòng</th>
                    <th>Trạng Thái</th>
                    <th>Hành Động</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Dữ liệu từ Backend sẽ được Javascript đổ tự động vào đây -->
            </tbody>
        </table>
    </div>

    <script>
        // 1. Hàm tự động gọi API lấy danh sách đơn đăng ký
        function fetchWaitlist() {
            fetch('/registration/waitlist')
                .then(response => response.json())
                .then(result => {
                    const tbody = document.getElementById('tableBody');
                    tbody.innerHTML = ''; // Xóa sạch dữ liệu trắng ban đầu

                    const data = result.data || result; // Lấy mảng dữ liệu

                    if (!data || data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Không có đơn đăng ký nào đang chờ.</td></tr>';
                        return;
                    }

                    // Vòng lặp vẽ từng hàng dữ liệu ra bảng
                    data.forEach(item => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                        <td>${item.id}</td>
                        <td>${item.student_code}</td>
                        <td>${item.full_name}</td>
                        <td>${item.room_id}</td>
                        <td class="status-pending">${item.status}</td>
                        <td>
                            <button class="btn btn-approve" onclick="updateStatus(${item.id}, 'approved')">Duyệt</button>
                            <button class="btn btn-reject" onclick="updateStatus(${item.id}, 'rejected')">Từ chối</button>
                        </td>
                    `;
                        tbody.appendChild(tr);
                    });
                })
                .catch(error => console.error('Lỗi tải dữ liệu:', error));
        }

        // 2. Hàm xử lý khi cán bộ bấm nút Duyệt hoặc Từ chối
        function updateStatus(id, newStatus) {
            // Hiện bảng hỏi xác nhận
            const actionName = newStatus === 'approved' ? 'DUYỆT' : 'TỪ CHỐI';
            if (!confirm(`Bạn có chắc chắn muốn ${actionName} đơn số ${id} này?`)) return;

            // Gửi lệnh PUT xuống Backend
            fetch(`/registration/update/${id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({ status: newStatus })
            })
                .then(response => response.json())
                .then(result => {
                    alert('Cập nhật trạng thái thành công!');
                    fetchWaitlist(); // Tải lại danh sách bảng ngay lập tức
                })
                .catch(error => {
                    console.error('Lỗi cập nhật:', error);
                    alert('Có lỗi xảy ra khi cập nhật!');
                });
        }

        // Khởi chạy hàm lấy dữ liệu ngay khi trang vừa load xong
        fetchWaitlist();
    </script>

</body>

</html>
