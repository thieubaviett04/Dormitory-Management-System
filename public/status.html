<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu Trạng Thái</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            padding-top: 50px;
            display: flex;
            justify-content: center;
        }

        .container {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 400px;
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #17a2b8;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #138496;
        }

        #result {
            margin-top: 20px;
            text-align: left;
        }

        .card {
            background: #f8f9fa;
            border-left: 5px solid #ccc;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 4px;
            position: relative;
        }

        .status-pending {
            color: #ffc107;
            font-weight: bold;
        }

        .status-approved {
            color: #28a745;
            font-weight: bold;
        }

        .status-rejected {
            color: #dc3545;
            font-weight: bold;
        }

        .status-waitlist {
            color: #fd7e14;
            font-weight: bold;
        }

        .status-cancelled {
            color: #6c757d;
            font-weight: bold;
        }

        .btn-cancel {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
        }

        .btn-cancel:hover {
            background-color: #c82333;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Tra Cứu Đơn Ký Túc Xá</h2>
        <p style="text-align: left; font-size: 14px; color: #666;">Nhập ID Hệ thống của sinh viên để tra cứu:</p>
        <input type="number" id="student_id" placeholder="Ví dụ: 1">
        <button onclick="checkStatus()">Tra Cứu Ngay</button>

        <div id="result"></div>
    </div>

    <script>
        const statusPresentation = {
            pending: ['Đang chờ duyệt', 'status-pending'],
            approved: ['Đã duyệt', 'status-approved'],
            rejected: ['Bị từ chối', 'status-rejected'],
            waitlist: ['Danh sách chờ', 'status-waitlist'],
            cancelled: ['Đã hủy', 'status-cancelled']
        };

        function escapeHtml(value) {
            const element = document.createElement('div');
            element.textContent = value ?? '';
            return element.innerHTML;
        }

        async function checkStatus() {
            const studentId = document.getElementById('student_id').value;
            if (!studentId) {
                alert("Vui lòng nhập ID Sinh viên!");
                return;
            }

            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Đang tìm kiếm...';

            try {
                const response = await fetch(`/registration/status/${studentId}`, {
                    headers: { 'Accept': 'application/json' }
                });
                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.message || 'Không thể tra cứu đơn đăng ký.');
                }

                resultDiv.innerHTML = '';
                result.data.forEach(item => {
                    const [statusText, statusClass] = statusPresentation[item.status] || [item.status, ''];
                    const canCancel = ['pending', 'waitlist'].includes(item.status);
                    const roomName = item.room
                        ? `${item.room.building?.code || ''}-${item.room.room_number}`
                        : `#${item.room_id}`;
                    const rejectedReason = item.rejected_reason
                        ? `<p><strong>Lý do từ chối:</strong> ${escapeHtml(item.rejected_reason)}</p>`
                        : '';
                    const cancellationReason = item.cancellation_reason
                        ? `<p><strong>Lý do hủy:</strong> ${escapeHtml(item.cancellation_reason)}</p>`
                        : '';
                    const cancelButton = canCancel
                        ? `<button class="btn-cancel" onclick="cancelRegistration(${item.id})">Hủy đơn này</button>`
                        : '';

                    resultDiv.innerHTML += `
                        <div class="card">
                            <p><strong>Mã Đơn:</strong> #${item.id}</p>
                            <p><strong>Phòng nguyện vọng:</strong> ${escapeHtml(roomName)}</p>
                            <p><strong>Ngày đăng ký:</strong> ${new Date(item.registered_at).toLocaleDateString('vi-VN')}</p>
                            <p><strong>Trạng thái:</strong> <span class="${statusClass}">${escapeHtml(statusText)}</span></p>
                            ${rejectedReason}
                            ${cancellationReason}
                            ${cancelButton}
                        </div>
                    `;
                });
            } catch (error) {
                console.error('Lỗi:', error);
                resultDiv.innerHTML = `<p style="color: red; text-align: center;">${escapeHtml(error.message)}</p>`;
            }
        }

        async function cancelRegistration(registrationId) {
            if (!confirm(`Bạn có chắc chắn muốn hủy đơn đăng ký #${registrationId} không?`)) {
                return;
            }

            const cancellationReason = prompt('Lý do hủy (không bắt buộc):') || null;

            try {
                const response = await fetch(`/registration/cancel/${registrationId}`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ cancellation_reason: cancellationReason })
                });
                const result = await response.json();

                if (!response.ok) {
                    const validationMessages = Object.values(result.errors || {}).flat();
                    throw new Error(validationMessages[0] || result.message || 'Không thể hủy đơn đăng ký.');
                }

                alert(result.message);
                checkStatus();
            } catch (error) {
                console.error('Lỗi:', error);
                alert(error.message || 'Có lỗi xảy ra khi hủy đơn!');
            }
        }
    </script>

</body>

</html>
